version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ems-db
    environment:
      MYSQL_DATABASE: ems_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ems-web
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/ems_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
